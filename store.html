<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Java Storefront</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5">
    <h1 class="mb-4">Product Catalog</h1>
    
    <div class="row">
        <div class="col-md-8">
            <div class="row">
                <div class="col-md-4 mb-3" th:each="product : ${products}">
                    <div class="card h-100">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${product.name}">Product</h5>
                            <p class="card-text" th:text="${'$' + product.price}">$0.00</p>
                            <form action="#" th:action="@{/cart/add}" method="post">
                                <input type="hidden" name="productId" th:value="${product.id}" />
                                <input type="hidden" name="quantity" value="1" />
                                <button type="submit" class="btn btn-primary btn-sm">Add to Cart</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h4>Shopping Cart</h4>
                    <ul class="list-group mb-3">
                        <li class="list-group-item d-flex justify-content-between lh-sm" th:each="item : ${cart}">
                            <div>
                                <h6 class="my-0" th:text="${item.name}">Item</h6>
                                <small class="text-muted" th:text="${'Qty: ' + item.quantity}">Qty: 1</small>
                            </div>
                            <span class="text-muted" th:text="${'$' + (item.price * item.quantity)}">$0.00</span>
                        </li>
                    </ul>
                    <div class="d-flex justify-content-between mb-3">
                        <strong>Total:</strong>
                        <strong th:text="${'$' + cartTotal}">$0.00</strong>
                    </div>
                    <a href="/api/checkout" class="btn btn-success w-100">Proceed to Checkout</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

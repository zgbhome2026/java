<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><nav><a th:href="@{/}">Shop</a><a th:href="@{/cart}">Cart</a></nav><main><h1>Demo checkout</h1><p>No payment is processed. Do not enter card details.</p><p class="error" th:if="${error}" th:text="${error}"></p><h2 th:text="|Total: ${total}|"></h2><form th:action="@{/checkout}" method="post"><label>Recipient<input name="recipient" maxlength="120" required></label><label>Address<input name="address" maxlength="250" required></label><label>City<input name="city" maxlength="120" required></label><button type="submit">Save demo order</button></form></main></body></html>

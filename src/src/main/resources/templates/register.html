<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><nav><a th:href="@{/}">Shop</a><a th:href="@{/login}">Login</a></nav><main><h1>Create account</h1><p class="error" th:if="${error}" th:text="${error}"></p><form th:action="@{/register}" method="post"><label>Username<input name="username" minlength="3" maxlength="40" pattern="[A-Za-z0-9_]+" required autocomplete="username"></label><label>Password<input name="password" type="password" minlength="8" maxlength="72" required autocomplete="new-password"></label><button type="submit">Register</button></form></main></body></html>

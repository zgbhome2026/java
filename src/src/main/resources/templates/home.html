<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>John's Shop</title><link rel="stylesheet" th:href="@{/style.css}"></head><body>
<nav><a th:href="@{/}">Shop</a><a th:href="@{/cart}">Cart</a><a th:href="@{/orders}">Orders</a><a th:if="${username == null}" th:href="@{/login}">Login</a><a th:if="${username == null}" th:href="@{/register}">Register</a><span th:if="${username != null}" th:text="|Hi, ${username}|"></span><form th:if="${username != null}" th:action="@{/logout}" method="post"><button type="submit">Logout</button></form></nav>
<main><h1>Shop</h1><p>Demo products. Your cart and orders are stored in PostgreSQL.</p><div class="grid"><article class="card" th:each="product : ${products}"><h2 th:text="${product.name}"></h2><p th:text="${product.description}"></p><p class="price" th:text="${product.price}"></p><form th:action="@{/cart/add}" method="post"><input type="hidden" name="productId" th:value="${product.id}"><button type="submit">Add to cart</button></form></article></div></main>
</body></html>

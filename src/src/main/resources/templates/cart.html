<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><nav><a th:href="@{/}">Shop</a><a th:href="@{/orders}">Orders</a></nav><main><h1>Your cart</h1><p th:if="${#lists.isEmpty(lines)}">Your cart is empty.</p><table th:unless="${#lists.isEmpty(lines)}"><tr><th>Item</th><th>Price</th><th>Qty</th><th>Subtotal</th><th></th></tr><tr th:each="item : ${lines}"><td th:text="${item.name}"></td><td th:text="${item.price}"></td><td th:text="${item.quantity}"></td><td th:text="${item.linePrice}"></td><td><form th:action="@{/cart/remove}" method="post"><input type="hidden" name="productId" th:value="${item.id}"><button type="submit">Remove</button></form></td></tr></table><h2 th:unless="${#lists.isEmpty(lines)}" th:text="|Total: ${total}|"></h2><a class="button" th:unless="${#lists.isEmpty(lines)}" th:href="@{/checkout}">Checkout</a></main></body></html>

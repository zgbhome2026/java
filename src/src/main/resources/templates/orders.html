<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><nav><a th:href="@{/}">Shop</a><a th:href="@{/cart}">Cart</a></nav><main><h1>Your orders</h1><p class="notice" th:if="${notice}" th:text="${notice}"></p><p th:if="${#lists.isEmpty(orders)}">No orders yet.</p><table th:unless="${#lists.isEmpty(orders)}"><tr><th>Order</th><th>Placed</th><th>Total</th></tr><tr th:each="order : ${orders}"><td th:text="${order.id}"></td><td th:text="${order.createdAt}"></td><td th:text="${order.total}"></td></tr></table></main></body></html>

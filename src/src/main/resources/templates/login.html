<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><nav><a th:href="@{/}">Shop</a><a th:href="@{/register}">Register</a></nav><main><h1>Login</h1><p class="error" th:if="${param.error}">Invalid username or password.</p><p class="notice" th:if="${param.registered}">Account created. Please log in.</p><form th:action="@{/login}" method="post"><label>Username<input name="username" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button type="submit">Login</button></form></main></body></html>

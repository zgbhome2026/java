apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-shopping-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: java-shopping-app

  template:
    metadata:
      labels:
        app: java-shopping-app

    spec:
      containers:
        - name: java-shopping-app
          image: java-shopping-app:v1
          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-svc:5432/shoppingdb"

            - name: SPRING_DATASOURCE_USERNAME
              value: "admin"

            - name: SPRING_DATASOURCE_PASSWORD
              value: "secretpassword"

---
apiVersion: v1
kind: Service
metadata:
  name: java-shopping-svc

spec:
  type: NodePort

  selector:
    app: java-shopping-app

  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
